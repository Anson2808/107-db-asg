<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback — CoWork</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav id="navbar"></nav>

<main class="page-container">
  <section class="menu-header">
    <h1 data-i18n="feedbackTitle">Feedback</h1>
    <p data-i18n="feedbackSubtitle">Share your experience or report an issue for a campus stall</p>
  </section>

  <section class="card feedback-card">
    <div id="feedbackMessage" class="alert" style="display:none"></div>

    <form id="feedbackForm" novalidate>
      <div class="form-group">
        <label for="stallId" class="form-label" data-i18n="foodStall">Food Stall</label>
        <select id="stallId" class="form-select" required>
          <option value="" data-i18n="selectStall">Select a stall</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rating" class="form-label" data-i18n="rating">Rating</label>
        <select id="rating" class="form-select" required>
          <option value="" data-i18n="selectRating">Select a rating</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Okay</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Very poor</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category" class="form-label" data-i18n="category">Category (for complaints)</label>
        <select id="category" class="form-select">
          <option value="" data-i18n="generalFeedback">General feedback</option>
          <option value="Hygiene">Hygiene</option>
          <option value="Service">Service</option>
          <option value="Food Quality">Food Quality</option>
          <option value="Wrong Order">Wrong Order</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comment" class="form-label" data-i18n="comment">Comment</label>
        <textarea id="comment" class="form-textarea" data-i18n-placeholder="feedbackPlaceholder" placeholder="Tell us what stood out about the food or service" required></textarea>
      </div>

      <button type="submit" id="submitFeedbackBtn" class="btn btn-primary" data-i18n="submitFeedback">Submit Feedback</button>
    </form>
  </section>

  <section class="card feedback-card my-feedback-card">
    <div class="card-header">
      <h2 class="table-title" data-i18n="myFeedback">My Submitted Feedback</h2>
      <p class="card-subtitle" data-i18n="myFeedbackSubtitle">Edit or delete feedback you have submitted</p>
    </div>
    <div id="myFeedbackList" class="my-feedback-list">
      <div class="empty-state" data-i18n="loadingFeedback">Loading feedback...</div>
    </div>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/feedback.js"></script>

</body>
</html>
