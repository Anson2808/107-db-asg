<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback & Complaint - CoWork</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav id="navbar"></nav>

<main class="page-container">
  <section class="menu-header">
    <h1 data-i18n="feedbackComplaintTitle">Feedback & Complaint</h1>
    <p data-i18n="feedbackComplaintSubtitle">Share your experience or report an issue for a campus stall</p>
  </section>

  <section class="card feedback-card">
    <div id="feedbackMessage" class="alert" style="display:none"></div>

    <form id="feedbackForm" novalidate>
      <div class="form-group">
        <label for="requestType" class="form-label" data-i18n="type">Type</label>
        <select id="requestType" class="form-select" required>
          <option value="feedback" data-i18n="feedback">Feedback</option>
          <option value="complaint" data-i18n="complaint">Complaint</option>
        </select>
      </div>

      <div class="form-group">
        <label for="stallId" class="form-label" data-i18n="foodStall">Food Stall</label>
        <select id="stallId" class="form-select" required>
          <option value="" data-i18n="selectStall">Select a stall</option>
        </select>
      </div>

      <div class="form-group" id="ratingGroup">
        <label for="rating" class="form-label" data-i18n="rating">Rating</label>
        <select id="rating" class="form-select" required>
          <option value="" data-i18n="selectRating">Select a rating</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Okay</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Very poor</option>
        </select>
      </div>

      <div class="form-group" id="categoryGroup" style="display:none">
        <label for="category" class="form-label" data-i18n="category">Category</label>
        <select id="category" class="form-select">
          <option value="" data-i18n="selectCategory">Select a category</option>
          <option value="Poor hygiene" data-i18n="poorHygiene">Poor hygiene</option>
          <option value="Bad service" data-i18n="badService">Bad service</option>
          <option value="Wrong order" data-i18n="wrongOrder">Wrong order</option>
          <option value="Food quality" data-i18n="foodQuality">Food quality</option>
          <option value="Other" data-i18n="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comment" class="form-label" data-i18n="comment">Comment</label>
        <textarea id="comment" class="form-textarea" data-i18n-placeholder="feedbackPlaceholder" placeholder="Tell us what stood out about the food or service" required></textarea>
      </div>

      <button type="submit" id="submitFeedbackBtn" class="btn btn-primary" data-i18n="submitFeedback">Submit Feedback</button>
    </form>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/feedback.js"></script>

</body>
</html>
