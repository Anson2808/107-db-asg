<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CoWork</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav id="navbar"></nav>

<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Create an account</h1>
    <p class="auth-subtitle">Join CoWork today</p>

    <div id="registerError" class="alert alert-error" style="display:none"></div>

    <form id="registerForm" class="auth-form" novalidate>
      <!-- Role toggle -->
      <div class="role-toggle" id="roleToggle">
        <button type="button" data-role="customer" class="active">Customer</button>
        <button type="button" data-role="stallOwner">Stall Owner</button>
      </div>
      <input type="hidden" id="role" name="role" value="customer">

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Choose a username" required minlength="3">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min. 8 characters" required minlength="8">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-input" placeholder="Your full name" required>
      </div>

      <!-- Conditional stall fields -->
      <div id="stallFields" class="conditional-fields">
        <div class="form-group">
          <label for="stallName" class="form-label">Stall Name</label>
          <input type="text" id="stallName" class="form-input" placeholder="Your stall name">
        </div>

        <div class="form-group">
          <label for="cuisineType" class="form-label">Cuisine Type</label>
          <input type="text" id="cuisineType" class="form-input" placeholder="e.g. Malay, Chinese, Indian">
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <p class="auth-link">
      Already have an account? <a href="/login.html">Log in</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/register.js"></script>

</body>
</html>
