<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | CoWork</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/cart.css">
</head>
<body>

<nav id="navbar"></nav>

<main class="checkout-main">

  <section class="page-title-section">
    <h1 class="page-title">Checkout</h1>
    <p class="page-subtitle">Review your order before placing it.</p>
  </section>

  <div class="checkout-grid">

    <div class="checkout-left-column">

      <section class="cart-section" aria-labelledby="cartSectionTitle">
        <h2 id="cartSectionTitle" class="section-heading">Your Cart</h2>
        <ul class="cart-item-list"></ul>
      </section>

      <section class="place-order-section">
        <button type="button" class="place-order-btn" disabled>Proceed to Payment →</button>
        <p class="checkout-note">Secure checkout — choose your payment method on the next page.</p>
        <a class="continue-browsing-link" href="/">← Continue browsing</a>
        <p class="place-order-message" role="status" aria-live="polite"></p>
      </section>

    </div>

    <aside class="checkout-sidebar">
      <section class="order-summary-section" aria-labelledby="orderSummaryTitle">
        <h2 id="orderSummaryTitle" class="section-heading">Order Summary</h2>
        <dl class="summary-list">
          <div class="summary-row">
            <dt class="summary-label">Subtotal</dt>
            <dd class="summary-value" id="summarySubtotal">$0.00</dd>
          </div>
          <div class="summary-row">
            <dt class="summary-label">Packaging Fee</dt>
            <dd class="summary-value" id="summaryPackagingFee">$0.00</dd>
          </div>
          <div class="summary-row">
            <dt class="summary-label">Delivery Fee</dt>
            <dd class="summary-value" id="summaryDeliveryFee">$0.00</dd>
          </div>
          <div class="summary-row">
            <dt class="summary-label">GST (9%)</dt>
            <dd class="summary-value" id="summaryGST">$0.00</dd>
          </div>
          <div class="summary-row summary-total-row">
            <dt class="summary-label summary-total-label">Grand Total</dt>
            <dd class="summary-value summary-total-value" id="summaryGrandTotal">$0.00</dd>
          </div>
        </dl>
      </section>
    </aside>

  </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>

</body>
</html>
