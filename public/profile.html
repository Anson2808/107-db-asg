<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CoWork</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav id="navbar"></nav>

<main class="page-container">
  <section class="menu-header">
    <h1 data-i18n="profile">Profile</h1>
    <p data-i18n="profileSubtitle">Manage your account details and password</p>
  </section>

  <div id="profileMessage" class="alert" style="display:none"></div>

  <section class="card profile-card" id="customerStatsCard" style="display:none">
    <h2 data-i18n="myStats">My Stats</h2>
    <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px;">
      <div style="background: var(--surface-secondary, #f3f4f6); padding: 16px; border-radius: 8px; flex: 1; min-width: 180px;">
        <span style="font-size: 13px; color: var(--text-muted, #6b7280);">Total Spent (All-Time)</span>
        <div style="font-size: 24px; font-weight: 700; color: var(--primary, #4f46e5); margin-top: 4px;" id="statTotalSpent">$0.00</div>
      </div>
      <div style="background: var(--surface-secondary, #f3f4f6); padding: 16px; border-radius: 8px; flex: 2; min-width: 240px;">
        <span style="font-size: 13px; color: var(--text-muted, #6b7280);">Top 3 Favorite Items</span>
        <ul id="statTopItemsList" style="margin-top: 8px; padding-left: 20px; font-size: 14px;">
          <li style="color: var(--text-muted);">No orders yet</li>
        </ul>
      </div>
    </div>
  </section>

  <section class="card profile-card">
    <h2 data-i18n="accountInfo">Account Information</h2>
    <div class="profile-info" id="profileInfo">
      <p><span class="info-label" data-i18n="username">Username</span>: <span id="dispUsername"></span></p>
      <p><span class="info-label" data-i18n="role">Role</span>: <span id="dispRole"></span></p>
      <p><span class="info-label" data-i18n="memberSince">Member Since</span>: <span id="dispCreatedAt"></span></p>
    </div>
  </section>

  <section class="card profile-card">
    <h2 data-i18n="editProfile">Edit Profile</h2>
    <form id="profileForm" novalidate>
      <div class="form-group">
        <label for="email" class="form-label" data-i18n="email">Email</label>
        <input type="email" id="email" class="form-input">
      </div>
      <div class="form-group">
        <label for="fullName" class="form-label" data-i18n="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-input">
      </div>
      <button type="submit" id="saveProfileBtn" class="btn btn-primary" data-i18n="saveChanges">Save Changes</button>
    </form>
  </section>

  <section class="card profile-card">
    <h2 data-i18n="changePassword">Change Password</h2>
    <form id="passwordForm" novalidate>
      <div class="form-group">
        <label for="currentPassword" class="form-label" data-i18n="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" class="form-input" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="newPassword" class="form-label" data-i18n="newPassword">New Password</label>
        <input type="password" id="newPassword" class="form-input" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmNewPassword" class="form-label" data-i18n="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" class="form-input" autocomplete="new-password">
      </div>
      <button type="submit" id="savePasswordBtn" class="btn btn-primary" data-i18n="updatePassword">Update Password</button>
    </form>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/profile.js"></script>

</body>
</html>
